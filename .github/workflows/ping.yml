# The minute pinger (ARCHITECTURE §6.4).
#
# Vercel Cron on the Hobby plan fires once a DAY and rejects a minute
# expression at deploy time, so the schedule lives here and calls the function.
# A minute cadence is what makes §6.4's 240-second budget and 120-second lease
# meaningful: a tick that cannot run often is a tick that cannot be short.
#
# GitHub's own scheduler is best-effort and skews under load — commonly by
# several minutes. That is fine by design. The sweep claims whatever is DUE
# rather than assuming it runs on time, and `next_fetch_at` carries ±5 minutes
# of stable jitter anyway, so a late tick polls a slightly longer list and a
# missed tick is picked up by the next one. Nothing here depends on punctuality.
#
# SETUP, both required or the workflow is a no-op that fails loudly:
#   gh secret set CRON_ENDPOINT --body "https://<your-deployment>/api/cron/poll"
#   gh secret set CRON_SECRET   --body "$(openssl rand -hex 32)"
# The same CRON_SECRET value goes in the Vercel project's environment
# variables. The route refuses every request until it is set on both sides.

name: Poll feeds

on:
  schedule:
    # Every five minutes. `* * * * *` is accepted but GitHub coalesces runs that
    # frequent, so asking for it would mean pretending to a cadence we do not
    # get. Five is honest, and the adaptive interval's floor is 15 minutes.
    - cron: "*/5 * * * *"
  # So a tick can be run by hand without waiting, e.g. after a deploy.
  workflow_dispatch:

# Nothing here touches the repository.
permissions:
  contents: read

concurrency:
  # One tick at a time. Overlapping ticks are safe — that is what the lease and
  # `SKIP LOCKED` are for — but queueing them up gains nothing and would hide a
  # sweep that had started running long.
  group: poll-feeds
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6 # The function caps itself at 300 s; this is the backstop.
    steps:
      - name: Tick
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # Fail loudly rather than silently doing nothing for weeks.
          : "${CRON_ENDPOINT:?set the CRON_ENDPOINT repository secret}"
          : "${CRON_SECRET:?set the CRON_SECRET repository secret}"

          # The secret goes in a header, never in the URL: query strings are
          # logged by proxies and show up in referrers.
          #
          # `|| rc=$?` rather than letting `set -e` act, and that matters: with
          # `--fail-with-body` a non-2xx makes curl exit non-zero, which under
          # `set -e` aborted the step BEFORE the `cat` below — so the body
          # explaining the failure was written to disk and never shown. The
          # whole point of `--fail-with-body` was defeated by the shell.
          rc=0
          http_code=$(curl --silent --show-error --fail-with-body \
            --max-time 300 \
            --retry 2 --retry-connrefused --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Length: 0" \
            --write-out '%{http_code}' \
            --output response.json \
            "${CRON_ENDPOINT}") || rc=$?

          echo "HTTP ${http_code:-none} (curl exit ${rc})"
          # The sweep's summary: claimed, changed, unchanged, failed, skipped,
          # itemsNew, budgetSpent. Worth having in the run log — it is the only
          # place a human sees a tick's outcome before the health screen exists.
          # Printed on failure too, which is when it is most useful.
          if [ -s response.json ]; then cat response.json; echo; fi

          # Now fail, with the body already in the log.
          exit "${rc}"
