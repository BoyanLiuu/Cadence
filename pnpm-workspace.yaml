# pnpm 12 refuses to install when a dependency's build script is neither
# allowed nor denied (ERR_PNPM_IGNORED_BUILDS). Locally that is a warning;
# on Vercel it fails the build outright. So decide every one explicitly.
allowBuilds:
  # Downloads its platform binary; a transitive dependency of the test runner.
  esbuild: true
  # Next uses its own image pipeline here and nothing imports sharp directly.
  # Denied rather than left undecided so the install does not stop to ask.
  sharp: false
  unrs-resolver: false
